name: Publish to GitHub Pages

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    # Only the default branch is published.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # GitHub Pages caches every file for 10 minutes, so right after a deploy a
      # browser could mix a new index.html with old scripts. Tagging every CSS/JS
      # URL (including module imports) with the commit keeps each version whole.
      - name: Version asset URLs
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"((css|js)/[^\"]+\.(css|js))\"#\1=\"\2?v=$v\"#g" index.html
          sed -i -E "s#(from '\./[^']+\.js)'#\1?v=$v'#g" js/*.js
      # The custom domain set in Settings → Pages lives in a CNAME file on
      # gh-pages; carry it over so publishing doesn't remove the domain.
      - name: Keep the custom domain
        run: |
          if [ ! -f CNAME ]; then
            git show origin/gh-pages:CNAME > CNAME 2>/dev/null || rm -f CNAME
          fi
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${GITHUB_SHA::8}"
          git push --force origin HEAD:gh-pages
