<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Interval Game · Daily ear training</title>
    <meta name="description" content="A daily ear training game: listen to two piano notes and name the interval, name the chord, or find the chord's degree in the key. New puzzles every day." />
    <link rel="canonical" href="https://intervalgame.com/" />
    <meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Interval Game" />
    <meta property="og:title" content="Interval Game · Can you name the interval?" />
    <meta property="og:description" content="A daily ear training game. Listen to two piano notes, name the interval in 4 guesses. New puzzle every day." />
    <meta property="og:url" content="https://intervalgame.com/" />
    <meta property="og:image" content="https://intervalgame.com/images/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Interval Game: a piano keyboard with two highlighted keys and the question: what's the interval?" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="images/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js"></script>
    <!-- Usage metrics (Umami): no cookies, only counted on the real domain; the URL hash (#chords…) isn't a new page. -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="b77ccf25-70d8-434e-85d4-d80f4a2cbe6b" data-domains="intervalgame.com" data-exclude-hash="true"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-side">
        <button class="icon-button" id="help-button" data-i18n-aria="howToPlay" aria-label="How to play">?</button>
        <button class="icon-button" id="settings-button" data-i18n-aria="settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)" /></svg>
        </button>
      </div>
      <h1>Interval Game</h1>
      <div class="topbar-side end">
        <div class="language-menu">
          <button class="icon-button flag-button" id="language-button" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="language" aria-label="Language"></button>
          <ul class="menu" id="language-list" role="menu" hidden></ul>
        </div>
        <button class="icon-button" id="stats-button" data-i18n-aria="statistics" aria-label="Statistics">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 20V10h3v10H4Zm6.5 0V4h3v16h-3ZM17 20v-7h3v7h-3Z" /></svg>
        </button>
      </div>
    </header>

    <main class="game">
      <div class="switches">
        <nav class="segmented" role="tablist" data-i18n-aria="gameType" aria-label="Game">
          <button role="tab" data-type="intervals" aria-selected="true" data-i18n="typeIntervals">Intervals</button>
          <button role="tab" data-type="chords" aria-selected="false" data-i18n="typeChords">Chords</button>
          <button role="tab" data-type="harmony" aria-selected="false" data-i18n="typeHarmony">Harmony</button>
        </nav>
        <nav class="segmented" role="tablist" data-i18n-aria="gameMode" aria-label="Game mode">
          <button role="tab" data-mode="daily" aria-selected="true" data-i18n="daily">Daily</button>
          <button role="tab" data-mode="practice" aria-selected="false" data-i18n="practice">Practice</button>
        </nav>
      </div>

      <p class="subtitle"><span id="day-label">#1</span> · <span id="question"></span></p>
      <p class="practice-stats" id="practice-stats" hidden></p>
      <p class="archive-note" id="archive-note" hidden><button class="link-button" id="back-to-today" data-i18n="backToToday">Back to today</button></p>

      <details class="practice-panel" id="practice-panel" hidden>
        <summary data-i18n="practiceSettings">Practice settings</summary>
        <div id="practice-panel-body"></div>
      </details>

      <section class="listen">
        <div class="listen-buttons">
          <button class="play-button" id="play-primary">
            <span class="play-icon" aria-hidden="true">▶</span>
            <span id="play-primary-label">Play notes</span>
          </button>
          <button class="play-button secondary" id="play-secondary" disabled>
            <span class="play-icon" aria-hidden="true">♫</span>
            <span id="play-secondary-label">Play together</span>
          </button>
        </div>
        <p class="listens-left" id="listens-left" hidden></p>
      </section>

      <ol class="attempts" id="attempts" data-i18n-aria="guesses" aria-label="Guesses"></ol>

      <ul class="hints" id="hints" aria-live="polite"></ul>

      <section class="result" id="result" hidden>
        <p class="result-title" id="result-title"></p>
        <p class="result-answer" id="result-answer"></p>
        <p class="result-song" id="result-song" hidden></p>
        <div class="keyboard" id="keyboard" aria-hidden="true"></div>
        <p class="result-tip" data-i18n="resultTip">Tap the answers below to compare them with the right one.</p>
        <div class="result-actions">
          <button class="action-button" id="share-button" data-i18n="share">Share</button>
          <button class="action-button" id="next-button" data-i18n="nextPuzzle" hidden>Next →</button>
          <div class="countdown" id="countdown-box">
            <span data-i18n="nextPuzzleIn">Next puzzle in</span>
            <strong id="countdown">--:--:--</strong>
          </div>
        </div>
        <button class="link-button" id="result-archive-button" data-i18n="playArchive">Play past puzzles</button>
      </section>

      <section class="choices" data-i18n-aria="options" aria-label="Answers">
        <nav class="segmented answer-switch" id="answer-switch" role="tablist" data-i18n-aria="answerWith" aria-label="How to answer" hidden>
          <button role="tab" data-answer="keyboard" data-i18n="answerWithKeyboard">🎹 Play it</button>
          <button role="tab" data-answer="list" data-i18n="answerWithList">☰ List</button>
        </nav>
        <p class="keyboard-help" id="keyboard-help" data-i18n="keyboardHelp" hidden></p>
        <div class="answer-keyboard" id="answer-keyboard" hidden><div class="answer-keys" id="answer-keys"></div></div>
        <div class="option-grid" id="option-grid"></div>
        <button class="confirm-button" id="confirm-button" disabled>Submit</button>
      </section>
    </main>

    <dialog class="modal" id="help-modal">
      <button class="close-button" data-close data-i18n-aria="close" aria-label="Close">×</button>
      <div data-i18n-html="help"></div>
    </dialog>

    <dialog class="modal" id="stats-modal">
      <button class="close-button" data-close data-i18n-aria="close" aria-label="Close">×</button>
      <h2 id="stats-title">Statistics</h2>
      <div class="stats" id="stats"></div>
      <h3 data-i18n="guessDistribution">Guess distribution</h3>
      <div class="distribution" id="distribution"></div>
      <button class="action-button wide" id="stats-archive-button" data-i18n="playArchive">Play past puzzles</button>
    </dialog>

    <dialog class="modal" id="archive-modal">
      <button class="close-button" data-close data-i18n-aria="close" aria-label="Close">×</button>
      <h2 id="archive-title">Past puzzles</h2>
      <ul class="archive-list" id="archive-list"></ul>
    </dialog>

    <dialog class="modal" id="settings-modal">
      <button class="close-button" data-close data-i18n-aria="close" aria-label="Close">×</button>
      <h2 data-i18n="settings">Settings</h2>
      <div class="setting">
        <label for="setting-hard"><strong data-i18n="hardMode">Hard mode</strong><small data-i18n="hardModeInfo"></small></label>
        <input type="checkbox" class="switch" id="setting-hard" />
      </div>
      <div class="setting">
        <label for="setting-contrast"><strong data-i18n="highContrast">High contrast colors</strong><small data-i18n="highContrastInfo"></small></label>
        <input type="checkbox" class="switch" id="setting-contrast" />
      </div>
      <div class="setting column">
        <strong data-i18n="instrument">Instrument</strong>
        <div class="choice-row" id="setting-instrument"></div>
      </div>
      <div class="setting column">
        <label for="setting-volume"><strong data-i18n="volume">Volume</strong></label>
        <input type="range" id="setting-volume" min="0" max="100" step="5" />
      </div>
      <div class="setting column">
        <strong data-i18n="transfer">Move your progress</strong>
        <small data-i18n="transferInfo"></small>
        <button class="action-button" id="export-button" data-i18n="copyCode">Copy code</button>
        <div class="import-row">
          <input type="text" id="import-input" autocomplete="off" spellcheck="false" />
          <button class="action-button secondary" id="import-button" data-i18n="importCode">Import</button>
        </div>
      </div>
      <p class="credits" data-i18n-html="credits"></p>
    </dialog>

    <div class="toast" id="toast" role="status" hidden></div>
  </body>
</html>
