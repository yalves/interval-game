<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A daily music game: listen to two piano notes and name the interval between them." />
    <meta name="theme-color" content="#121213" />
    <title>Musicle</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <button class="icon-button" id="help-button" data-i18n-aria="howToPlay" aria-label="How to play">?</button>
      <h1>Musicle</h1>
      <div class="topbar-actions">
        <select class="language-select" id="language-select" data-i18n-aria="language" aria-label="Language">
          <option value="en">EN</option>
          <option value="pt-BR">PT</option>
        </select>
        <button class="icon-button" id="stats-button" data-i18n-aria="statistics" aria-label="Statistics">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 20V10h3v10H4Zm6.5 0V4h3v16h-3ZM17 20v-7h3v7h-3Z" /></svg>
        </button>
      </div>
    </header>

    <main class="game">
      <nav class="modes" role="tablist" data-i18n-aria="gameMode" aria-label="Game mode">
        <button role="tab" data-mode="daily" aria-selected="true" data-i18n="daily">Daily</button>
        <button role="tab" data-mode="practice" aria-selected="false" data-i18n="practice">Practice</button>
      </nav>

      <p class="subtitle"><span id="day-label">#1</span> · <span data-i18n="question">What's the interval between the two notes?</span></p>
      <p class="practice-stats" id="practice-stats" hidden></p>

      <section class="listen">
        <button class="play-button" id="play-melodic">
          <span class="play-icon" aria-hidden="true">▶</span>
          <span data-i18n="playNotes">Play notes</span>
        </button>
        <button class="play-button secondary" id="play-harmonic" disabled>
          <span class="play-icon" aria-hidden="true">♫</span>
          <span data-i18n="playTogether">Play together</span>
        </button>
      </section>

      <ol class="attempts" id="attempts" data-i18n-aria="guesses" aria-label="Guesses"></ol>

      <ul class="hints" id="hints" aria-live="polite"></ul>

      <section class="result" id="result" hidden>
        <p class="result-title" id="result-title"></p>
        <p class="result-answer" id="result-answer"></p>
        <div class="keyboard" id="keyboard" aria-hidden="true"></div>
        <p class="result-tip" data-i18n="resultTip">Tap the intervals below to compare them with the answer.</p>
        <div class="result-actions">
          <button class="share-button" id="share-button" data-i18n="share">Share</button>
          <button class="share-button" id="next-button" data-i18n="nextInterval" hidden>Next interval →</button>
          <div class="countdown" id="countdown-box">
            <span data-i18n="nextPuzzleIn">Next puzzle in</span>
            <strong id="countdown">--:--:--</strong>
          </div>
        </div>
      </section>

      <section class="choices" data-i18n-aria="intervalsLabel" aria-label="Intervals">
        <div class="interval-grid" id="interval-grid"></div>
        <button class="confirm-button" id="confirm-button" disabled>Submit</button>
      </section>
    </main>

    <dialog class="modal" id="help-modal">
      <button class="close-button" data-close data-i18n-aria="close" aria-label="Close">×</button>
      <div data-i18n-html="help"></div>
    </dialog>

    <dialog class="modal" id="stats-modal">
      <button class="close-button" data-close data-i18n-aria="close" aria-label="Close">×</button>
      <h2 data-i18n="statistics">Statistics</h2>
      <div class="stats" id="stats"></div>
      <h3 data-i18n="guessDistribution">Guess distribution</h3>
      <div class="distribution" id="distribution"></div>
    </dialog>

    <div class="toast" id="toast" role="status" hidden></div>
  </body>
</html>
